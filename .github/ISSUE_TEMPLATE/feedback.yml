name: 気づき・改善メモ
description: 利用中に気づいたことを短く残す
title: "[feedback] "
labels:
  - feedback
body:
  - type: textarea
    id: memo
    attributes:
      label: 気づき・改善メモ
      description: 1文だけでも登録できます
      placeholder: 例：ラーメンに油そばがない
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: スクリーンショット
      description: 必要に応じて画像を添付してください
      placeholder: 画像をドラッグ＆ドロップ
    validations:
      required: false
